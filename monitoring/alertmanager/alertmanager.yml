global:
  resolve_timeout: 5m
  # Using the environment variable as it was configured previously
  slack_api_url: ${SLACK_WEBHOOK_URL}

route:
  group_by: ['alertname', 'cluster', 'service', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  
  # Default receiver for alerts that don't match any specific route (Low priority)
  receiver: 'slack-general'

  routes:
    # High Priority Routing
    - matchers:
        - severity=~"critical|high|emergency"
      receiver: 'slack-devops'
      continue: false

    # Low Priority Routing
    - matchers:
        - severity=~"warning|info"
      receiver: 'slack-general'
      continue: false

# Mute predictable noise
inhibit_rules:
  # Mute warning/info alerts if a critical alert is firing for the same instance/node
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity=~"warning|info"
    equal: ['instance', 'node', 'job']

receivers:
  - name: 'slack-devops'
    slack_configs:
      - channel: '#devops'
        send_resolved: true
        title: '🚨 [{{ .Status | toUpper }}] {{ .GroupLabels.alertname }} ({{ .Alerts.Firing | len }} firing)'
        text: >-
          *Environment:* `{{ (index .Alerts 0).Labels.env }}`
          *Severity:* 🔴 `{{ (index .Alerts 0).Labels.severity }}`
          *Who to Call:* ☎️ {{ (index .Alerts 0).Annotations.oncall_team }}
          *Impact:* {{ (index .Alerts 0).Annotations.impact }}
          
          *Details:*
          {{ range .Alerts -}}
          • {{ .Annotations.description }}
          {{ end }}

  - name: 'slack-general'
    slack_configs:
      - channel: '#main1'
        send_resolved: true
        title: '⚠️ [{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
        text: >-
          *Severity:* 🟡 `{{ (index .Alerts 0).Labels.severity }}`
          *Details:*
          {{ range .Alerts -}}
          • {{ .Annotations.description }}
          {{ end }}
