name: PaathShala AI - CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # -------------------------------------------------------------------
  # 1. Backend Testing & Linting
  # -------------------------------------------------------------------
  test-backend:
    name: Test Backend API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ankane/pgvector:v0.5.1
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paathshala
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/paathshala
          REDIS_URL: redis://localhost:6379/0
          GEMINI_API_KEY: test_api_key
        run: |
          cd backend
          pytest -v

  # -------------------------------------------------------------------
  # 2. Frontend Build Verification
  # -------------------------------------------------------------------
  build-frontend:
    name: Build Frontend SPA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Compile & Build Frontend
        run: |
          cd frontend
          npm run build

  # -------------------------------------------------------------------
  # 3. Docker & Monitoring Configuration Validation
  # -------------------------------------------------------------------
  validate-infrastructure:
    name: Validate Docker & Prometheus Configs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Validate Prometheus Configuration
        uses: docker://prom/prometheus:v2.51.0
        with:
          entrypoint: /bin/promtool
          args: check config ./monitoring/prometheus/prometheus.yml
